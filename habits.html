<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B2340" />
  <title>習慣 — 共有リスト</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Overlay: pede o nome antes de usar (mesmo mecanismo da lista) -->
  <div id="name-gate" class="overlay">
    <div class="overlay-card">
      <p class="eyebrow">始める前に</p>
      <h1>お名前を教えてください</h1>
      <p class="overlay-hint">習慣を達成した日に、あなたの名前が表示されます。</p>
      <form id="name-form">
        <input id="name-input" type="text" maxlength="24" placeholder="お名前" autocomplete="name" required />
        <button type="submit">入る</button>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="app-header">
      <div class="header-text">
        <p class="eyebrow">毎日の記録</p>
        <h1>習慣</h1>
      </div>
      <button id="who-am-i" class="avatar-tag" title="名前を変更"></button>
    </header>

    <nav class="page-nav">
      <a href="index.html" class="page-nav-link">リスト</a>
      <a href="habits.html" class="page-nav-link active">習慣</a>
    </nav>

    <p id="status-banner" class="status-banner hidden"></p>

    <main class="list-wrap">
      <div class="month-switcher">
        <button id="prev-month" class="month-btn" aria-label="前の月">‹</button>
        <p id="month-label" class="month-label"></p>
        <button id="next-month" class="month-btn" aria-label="次の月">›</button>
      </div>

      <div id="habit-list" class="habit-list"></div>

      <div id="empty-state" class="empty-state hidden">
        <p class="eyebrow">習慣がまだありません</p>
        <p>下から最初の習慣を追加して記録を始めましょう。</p>
      </div>
    </main>

    <form id="add-form" class="add-bar">
      <input id="habit-input" type="text" placeholder="新しい習慣（例：水を飲む）..." autocomplete="off" maxlength="60" required />
      <button type="submit" aria-label="追加">+</button>
    </form>
  </div>

  <script type="module" src="habits.js"></script>
</body>
</html>
