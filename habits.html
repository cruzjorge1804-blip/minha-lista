<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B2340" />
  <title>Hábitos — Lista Compartilhada</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Overlay: pede o nome antes de usar (mesmo mecanismo da lista) -->
  <div id="name-gate" class="overlay">
    <div class="overlay-card">
      <p class="eyebrow">antes de começar</p>
      <h1>Como podemos te chamar?</h1>
      <p class="overlay-hint">Seu nome aparece marcado nos dias em que você completar cada hábito.</p>
      <form id="name-form">
        <input id="name-input" type="text" maxlength="24" placeholder="Seu nome" autocomplete="name" required />
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="app-header">
      <div class="header-text">
        <p class="eyebrow">acompanhamento diário</p>
        <h1>Hábitos</h1>
      </div>
      <button id="who-am-i" class="avatar-tag" title="Trocar nome"></button>
    </header>

    <nav class="page-nav">
      <a href="index.html" class="page-nav-link">Lista</a>
      <a href="habits.html" class="page-nav-link active">Hábitos</a>
    </nav>

    <p id="status-banner" class="status-banner hidden"></p>

    <main class="list-wrap">
      <div class="month-switcher">
        <button id="prev-month" class="month-btn" aria-label="Mês anterior">‹</button>
        <p id="month-label" class="month-label"></p>
        <button id="next-month" class="month-btn" aria-label="Próximo mês">›</button>
      </div>

      <div id="habit-list" class="habit-list"></div>

      <div id="empty-state" class="empty-state hidden">
        <p class="eyebrow">nenhum hábito ainda</p>
        <p>Adicione o primeiro hábito abaixo para começar a acompanhar.</p>
      </div>
    </main>

    <form id="add-form" class="add-bar">
      <input id="habit-input" type="text" placeholder="Novo hábito (ex: beber água)..." autocomplete="off" maxlength="60" required />
      <button type="submit" aria-label="Adicionar">+</button>
    </form>
  </div>

  <script type="module" src="habits.js"></script>
</body>
</html>
