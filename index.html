<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B2340" />
  <title>Lista Compartilhada</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Overlay: pede o nome antes de usar a lista -->
  <div id="name-gate" class="overlay">
    <div class="overlay-card">
      <p class="eyebrow">antes de começar</p>
      <h1>Como podemos te chamar?</h1>
      <p class="overlay-hint">Seu nome aparece ao lado do que você adicionar ou marcar, pra todo mundo do grupo saber quem fez o quê.</p>
      <form id="name-form">
        <input id="name-input" type="text" maxlength="24" placeholder="Seu nome" autocomplete="name" required />
        <button type="submit">Entrar na lista</button>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="app-header">
      <div class="header-text">
        <p class="eyebrow">lista compartilhada</p>
        <h1>Combinados</h1>
      </div>
      <button id="who-am-i" class="avatar-tag" title="Trocar nome"></button>
    </header>

    <p id="status-banner" class="status-banner hidden"></p>

    <main class="list-wrap">
      <ul id="item-list" class="item-list"></ul>
      <div id="empty-state" class="empty-state hidden">
        <p class="eyebrow">tudo limpo</p>
        <p>Nada por aqui ainda. Adicione o primeiro item abaixo.</p>
      </div>
    </main>

    <form id="add-form" class="add-bar">
      <input id="item-input" type="text" placeholder="Adicionar item..." autocomplete="off" maxlength="200" required />
      <button type="submit" aria-label="Adicionar">+</button>
    </form>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
