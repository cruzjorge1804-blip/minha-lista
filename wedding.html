<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B2340" />
  <title>結婚式 — 共有リスト</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Overlay: pede o nome antes de usar (mesmo mecanismo das outras páginas) -->
  <div id="name-gate" class="overlay">
    <div class="overlay-card">
      <p class="eyebrow">始める前に</p>
      <h1>お名前を教えてください</h1>
      <p class="overlay-hint">完了した項目にあなたの名前が表示されます。</p>
      <form id="name-form">
        <input id="name-input" type="text" maxlength="24" placeholder="お名前" autocomplete="name" required />
        <button type="submit">入る</button>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <div class="theme-banner">
      <p class="theme-label">目的</p>
      <p class="theme-text">御経綸御成就に向かい家庭内の正法実践の確立を目指し、一緒に神向きを深めていく訓練をさせていただく</p>
      <p class="theme-note">◎実践の前にはお参りをして波長合わせをさせていただいてから行う</p>
    </div>

    <header class="app-header">
      <div class="header-text">
        <p class="eyebrow">計画表</p>
        <h1>結婚式</h1>
      </div>
      <button id="who-am-i" class="avatar-tag" title="名前を変更"></button>
    </header>

    <nav class="page-nav">
      <a href="index.html" class="page-nav-link">リスト</a>
      <a href="habits.html" class="page-nav-link">習慣</a>
      <a href="wedding.html" class="page-nav-link active">結婚式</a>
    </nav>

    <p id="status-banner" class="status-banner hidden"></p>

    <main class="list-wrap">
      <button id="toggle-add" class="toggle-add-btn">＋ 新しい項目を追加</button>

      <form id="add-form" class="milestone-form hidden">
        <div class="milestone-form-row">
          <div class="field">
            <label for="ms-year">年</label>
            <select id="ms-year"></select>
          </div>
          <div class="field">
            <label for="ms-month">月</label>
            <select id="ms-month">
              <option value="1">1月</option>
              <option value="2">2月</option>
              <option value="3">3月</option>
              <option value="4">4月</option>
              <option value="5">5月</option>
              <option value="6">6月</option>
              <option value="7">7月</option>
              <option value="8">8月</option>
              <option value="9">9月</option>
              <option value="10">10月</option>
              <option value="11">11月</option>
              <option value="12">12月</option>
            </select>
          </div>
          <div class="field field-day">
            <label for="ms-day">日（任意）</label>
            <input id="ms-day" type="number" min="1" max="31" placeholder="—" />
          </div>
        </div>

        <input id="ms-title" type="text" placeholder="項目名（例：結婚申請）" maxlength="120" required />
        <textarea id="ms-notes" placeholder="メモ（任意）" rows="2" maxlength="500"></textarea>

        <button type="submit">追加する</button>
      </form>

      <div id="milestone-groups" class="milestone-groups"></div>

      <div id="empty-state" class="empty-state hidden">
        <p class="eyebrow">項目がまだありません</p>
        <p>「＋ 新しい項目を追加」から計画表を作り始めましょう。</p>
      </div>
    </main>
  </div>

  <script type="module" src="wedding.js"></script>
</body>
</html>
